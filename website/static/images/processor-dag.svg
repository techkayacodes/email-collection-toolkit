<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" aria-labelledby="title desc" role="img" viewBox="0 0 1500 1100"><title id="title">Ingest, message, and content processing</title><desc id="desc">ClamAV scans before filing. Filing queues message processing, which stores metadata and queues MIME content processing. MIME extraction feeds text/plain directly and HTML or RTF conversion above it. Discovered child messages return to message processing without another antivirus scan.</desc><defs><marker id="arrow" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4.5"><path fill="none" stroke="#486078" stroke-width="1.4" d="M1 1 L8 4.5 L1 8"/></marker><marker id="return" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4.5"><path fill="none" stroke="#97631b" stroke-width="1.4" d="M1 1 L8 4.5 L1 8"/></marker><style>text{font-family:Arial,sans-serif;fill:#20354a;font-size:18px}.heading,.title{font-weight:700}.title{font-size:30px}.heading{font-size:23px}.small{font-size:16px;fill:#486078}.box{fill:#fff;stroke:#9aabba;stroke-width:1.5;rx:10}.flow,.return{fill:none;stroke:#486078;stroke-width:2;marker-end:url(#arrow)}.return{stroke:#97631b;stroke-width:2.5;marker-end:url(#return)}.note{fill:#fff5df;stroke:#b69252;stroke-width:1.5;rx:10}</style></defs><rect width="1500" height="1100" fill="#fff"/><text x="40" y="48" class="title">Ingest, message, and content processing</text><text x="40" y="80" class="small">Proposed plugin architecture · not yet implemented</text><rect width="1420" height="74" x="40" y="110" class="box"/><text x="56" y="140">Source / container acquisition → original messages and provenance</text><text x="56" y="166" class="small">Source plugins → file-parser plugins (MBOX, EML, EMLX, Babyl, …) → ingest handoff</text><rect width="425" height="650" x="30" y="240" fill="#eff7f2" rx="16"/><text x="52" y="278" class="heading">1 · Ingest</text><rect width="410" height="650" x="530" y="240" fill="#eef4fb" rx="16"/><text x="552" y="278" class="heading">2 · Message processing</text><rect width="460" height="650" x="1010" y="240" fill="#f7f1fb" rx="16"/><text x="1032" y="278" class="heading">3 · Content processing</text><rect width="355" height="74" x="60" y="320" class="box"/><text x="76" y="350">ClamAV · rank 1</text><text x="76" y="376" class="small">Scan the entire raw message</text><path d="M237 184 V320" class="flow"/><rect width="355" height="98" x="60" y="470" class="box"/><text x="76" y="500">Filing / handoff · rank 2</text><text x="76" y="526" class="small">Standard deduplication</text><text x="76" y="550" class="small">Write mailbox + queue pipeline 2</text><path d="M237 394 V470" class="flow"/><text x="252" y="435" class="small">continue</text><rect width="355" height="98" x="60" y="680" class="note"/><text x="76" y="710">INFECTED.mbox</text><text x="76" y="736" class="small">Preserve original bytes</text><text x="76" y="760" class="small">Record outcome; stop this message</text><path d="M415 355 H440 V720 H415" class="flow"/><text x="65" y="828" class="small">All plugins can access all headers</text><text x="65" y="852" class="small">and all content of their message.</text><rect width="370" height="74" x="550" y="320" class="box"/><text x="566" y="350">Header / metadata extraction</text><text x="566" y="376" class="small">Store message metadata in SQLite</text><path d="M415 519 H480 V357 H550" class="flow"/><rect width="370" height="74" x="550" y="470" class="box"/><text x="566" y="500">Other message subscribers</text><text x="566" y="526" class="small">Honor declared dependencies</text><path d="M735 394 V470" class="flow"/><rect width="370" height="74" x="550" y="620" class="box"/><text x="566" y="650">Content handoff</text><text x="566" y="676" class="small">Durably queue content processing</text><path d="M735 544 V620" class="flow"/><rect width="410" height="74" x="1030" y="320" class="box"/><text x="1046" y="350">MIME extractor</text><text x="1046" y="376" class="small">Emit typed body / attachment content</text><path d="M920 657 H975 V357 H1030" class="flow"/><rect width="280" height="98" x="1130" y="440" class="box"/><text x="1146" y="470">HTML / RTF</text><text x="1146" y="496" class="small">Body text fallback</text><text x="1146" y="520" class="small">Prefer HTML over RTF</text><path d="M1270 394 V440" class="flow"/><rect width="280" height="74" x="1130" y="590" class="box"/><text x="1146" y="620">text/plain</text><text x="1146" y="646" class="small">Identity evidence / indexing</text><path d="M1270 538 V590" class="flow"/><path d="M1055 394 V627 H1130" class="flow"/><text x="1067" y="568" class="small">direct</text><rect width="410" height="74" x="1030" y="710" class="box"/><text x="1046" y="740">Other MIME subscribers</text><text x="1046" y="766" class="small">Process other content and attachments</text><path d="M1440 357 H1455 V747 H1440" class="flow"/><rect width="410" height="50" x="1030" y="820" class="note"/><text x="1046" y="850">Discovered child message</text><path d="M1235 784 V820" class="flow"/><path d="M1030 845 H990 V930 H505 V215 H735 V320" class="return"/><text x="550" y="918" class="small">New child job → message processing; no antivirus rescan</text><text x="553" y="795" class="small">Child: parent path + attachment tag</text><text x="553" y="821" class="small">Retain parent scan provenance</text><text x="553" y="847" class="small">Apply standard deduplication</text><rect width="1420" height="98" x="40" y="975" class="box"/><text x="56" y="1005">Shared services and execution rules</text><text x="56" y="1031" class="small">Ranks and dependencies • part / message / import abort • scanner timeout: 60 seconds by default</text><text x="56" y="1055" class="small">Durable checkpoints • per-plugin timing statistics • synthetic text is processing-only, never canonical mail</text></svg>